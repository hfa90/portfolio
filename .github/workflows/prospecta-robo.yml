name: Prospecta · build do robô para Windows (.exe)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scrapermapa/robo/**'
      - '.github/workflows/prospecta-robo.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: scrapermapa/robo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # O .exe usa o Microsoft Edge/Chrome já instalados no PC (não embute navegador)
      - name: Gerar ProspectaRobo.exe
        run: pyinstaller --onefile --console --name ProspectaRobo --collect-all playwright robo.py

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ProspectaRobo
          path: scrapermapa/robo/dist/ProspectaRobo.exe

      - name: Publicar na release "prospecta-robo"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prospecta-robo >/dev/null 2>&1 || \
            gh release create prospecta-robo --title "Prospecta · Robô para Windows" \
              --notes "Baixe o ProspectaRobo.exe, execute e entre com seu e-mail e senha do Prospecta. Requer Microsoft Edge ou Google Chrome instalado."
          gh release upload prospecta-robo dist/ProspectaRobo.exe --clobber
