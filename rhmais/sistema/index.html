<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>RH+ Match</title>
  <meta name="description" content="RH+ Match — busca de vagas em vários portais com ranking de compatibilidade para consultorias de RH.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RH+ Match">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <!-- telas de abertura do app instalado no iPhone/iPad -->
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" href="../icons/splash/splash-1320x2868.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="../icons/splash/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" href="../icons/splash/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="../icons/splash/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="../icons/splash/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="../icons/splash/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="../icons/splash/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="../icons/splash/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="../icons/splash/splash-750x1334.png">
  <link rel="apple-touch-startup-image" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2)" href="../icons/splash/splash-1640x2360.png">
  <link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" href="../icons/splash/splash-2048x2732.png">
  <link rel="stylesheet" href="style.css">
  <script>try{var d=document.documentElement,n=navigator,a=/Mac|iPhone|iPad|iPod/.test(n.platform||"")||/iPhone|iPad|Macintosh/.test(n.userAgent);d.classList.add(a?"apple":"nao-apple");d.dataset.theme=localStorage.getItem("rh_tema")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
</head>
<body class="sem-sessao">
  <aside class="sidebar">
    <div class="brand"><span class="logo">R+</span><div><b>RH+ Match</b><small>Inteligência em recolocação</small></div></div>
    <nav aria-label="Navegação principal"></nav>
    <div class="side-foot">
      <span class="usuario" id="usuario"></span>
      <button id="btnTema" class="btn-ghost" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg><span>Tema</span></button>
      <button id="btnSair" class="btn-ghost" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg><span>Sair</span></button>
    </div>
  </aside>
  <div id="barraTopo" aria-hidden="true"><span></span></div>
  <main id="conteudo"><div class="vazio">Carregando…</div></main>
  <div id="sheetBarra" hidden><button id="sheetVoltar" type="button" aria-label="Voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg><span>Voltar</span></button><b id="sheetTitulo"></b></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><button class="btn-circ modal-fechar" type="button" data-fechar aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div id="modalCorpo"></div></dialog>
  <dialog id="alerta" class="alerta"></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../config.js"></script>
  <script src="../instalar.js" defer></script>
  <script type="module" src="app.js"></script>
  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
