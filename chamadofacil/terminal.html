<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Terminal de Coletores · CD-AM</title>
  <meta name="theme-color" content="#0B2E2A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="term">
    <header class="term-head">
      <img src="assets/marca.png" alt="">
      <div><b>Terminal de coletores</b><div style="font-size:.78rem;color:rgba(255,255,255,.55)" class="hide-sm">Retirada e devolução · CD-AM</div></div>
      <div class="spacer"></div>
      <span class="turno-pill"><i></i><span class="lbl">Turno</span> <b id="turno">–</b></span>
      <span class="term-clock" id="relogio">--:--</span>
    </header>

    <div class="term-body">
      <div class="term-main">
        <div class="term-steps">
          <div class="tstep active" id="st-pessoa">
            <div class="n">1</div>
            <h3>Bipe seu crachá</h3>
            <p>Código de barras, QR ou matrícula digitada + Enter.</p>
            <div class="val" id="val-pessoa"></div>
          </div>
          <div class="tstep" id="st-coletor">
            <div class="n">2</div>
            <h3>Bipe o coletor</h3>
            <p>QR code ou código de barras da etiqueta (ex.: COL-012).</p>
            <div class="val" id="val-coletor"></div>
          </div>
        </div>

        <form class="scan-box" id="form" autocomplete="off">
          <span id="ic-scan"></span>
          <input id="scan" placeholder="Aguardando leitura…" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go">
        </form>

        <div class="term-result" id="result"></div>

        <div class="term-actions">
          <button class="btn" id="btn-cam"></button>
          <button class="btn" id="btn-limpar"></button>
          <a class="btn" href="app.html#coletores" id="btn-painel"></a>
        </div>
        <div class="cam-box hidden" id="cam-box"><div id="cam" style="width:100%"></div></div>
      </div>

      <aside class="term-side">
        <h3><i></i>Movimentações de hoje</h3>
        <div class="term-feed" id="feed"></div>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/terminal.js"></script>
</body>
</html>
