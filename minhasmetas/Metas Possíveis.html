<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Metas Possíveis – planejamento financeiro por diluição</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #fff;
      --tx: #0f1b2d;
      --mut: #64748b;
      --br: #e3e8ef;
      --pri: #0b7a5a;
      --pri2: #10b981;
      --navy: #0f2a47;
      --soft: #ecf7f2;
      --in: #f9fafc;
      --sh: 0 1px 2px rgba(15, 27, 45, .05), 0 6px 20px rgba(15, 27, 45, .06)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b121c;
        --card: #131d2b;
        --tx: #e6edf5;
        --mut: #8b9bb0;
        --br: #233248;
        --pri: #34d399;
        --pri2: #10b981;
        --navy: #0a1626;
        --soft: #0f2a25;
        --in: #0f1926;
        --sh: 0 6px 20px rgba(0, 0, 0, .35)
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b121c;
      --card: #131d2b;
      --tx: #e6edf5;
      --mut: #8b9bb0;
      --br: #233248;
      --pri: #34d399;
      --pri2: #10b981;
      --navy: #0a1626;
      --soft: #0f2a25;
      --in: #0f1926;
      --sh: 0 6px 20px rgba(0, 0, 0, .35)
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased
    }

    header {
      background: linear-gradient(135deg, var(--navy), #134e4a);
      color: #fff;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 70px
    }

    .in {
      max-width: 1080px;
      margin: 0 auto
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--pri2);
      display: grid;
      place-items: center
    }

    .acts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    header h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin: 28px 0 6px;
      letter-spacing: -.02em
    }

    header p {
      margin: 0;
      color: #b8c7d9;
      max-width: 620px
    }

    main {
      max-width: 1080px;
      margin: -46px auto 0;
      padding: 0 16px calc(50px + env(safe-area-inset-bottom, 0px))
    }

    .card {
      background: var(--card);
      border: 1px solid var(--br);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--sh);
      margin-bottom: 16px
    }

    h2 {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--mut);
      margin: 0 0 14px;
      font-weight: 700
    }

    button {
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 14px;
      background: var(--pri);
      color: #fff;
      transition: .15s
    }

    button:hover {
      filter: brightness(1.08)
    }

    button.g {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .25);
      color: #fff
    }

    button.s {
      background: var(--card);
      color: var(--tx);
      border-color: var(--br)
    }

    button.s:hover {
      background: var(--soft)
    }

    button.p {
      background: var(--pri2);
      color: #04241a
    }

    input,
    select {
      font: inherit;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--br);
      border-radius: 10px;
      background: var(--in);
      color: var(--tx)
    }

    input:focus,
    select:focus {
      outline: 2px solid var(--pri2);
      border-color: transparent
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: .78rem;
      font-weight: 600;
      color: var(--mut)
    }

    .dash {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 24px;
      align-items: center
    }

    .ring {
      --p: 0;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: conic-gradient(var(--pri2) calc(var(--p)*1%), var(--br) 0);
      display: grid;
      place-items: center;
      flex: none
    }

    .ring span {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--card);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.3rem
    }

    .ring.sm {
      width: 64px;
      height: 64px
    }

    .ring.sm span {
      width: 48px;
      height: 48px;
      font-size: .85rem
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px
    }

    .k small {
      display: block;
      color: var(--mut);
      font-size: .78rem
    }

    .k b {
      font-size: 1.3rem;
      letter-spacing: -.01em
    }

    .bk {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: .85rem;
      color: var(--mut)
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b
    }

    .dot.ok {
      background: var(--pri2)
    }

    #banner {
      display: none;
      background: var(--soft);
      border: 1px solid var(--pri2);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 12px;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .top2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 26px 0 12px;
      gap: 10px;
      flex-wrap: wrap
    }

    .top2 h3 {
      margin: 0;
      font-size: 1.25rem
    }

    .goals {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 470px), 1fr));
      gap: 16px
    }

    .goals .card {
      margin: 0
    }

    .gh {
      display: flex;
      gap: 14px;
      align-items: center
    }

    .gh h3 {
      margin: 0;
      font-size: 1.1rem
    }

    .gh .m {
      color: var(--mut);
      font-size: .85rem
    }

    .emo {
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--soft);
      display: grid;
      place-items: center;
      flex: none
    }

    .tag {
      background: var(--soft);
      border-left: 3px solid var(--pri2);
      border-radius: 8px;
      padding: 9px 12px;
      margin: 14px 0;
      font-size: .9rem
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px
    }

    .chip {
      border: 1px solid var(--br);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center
    }

    .chip.hl {
      border-color: var(--pri2);
      background: var(--soft)
    }

    .chip small {
      display: block;
      color: var(--mut);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .chip b {
      font-size: .95rem
    }

    .cells {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 10px 0
    }

    .cell {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: var(--br)
    }

    .cell.on {
      background: var(--pri2)
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 12px
    }

    .row input {
      width: 120px
    }

    .mut {
      color: var(--mut);
      font-size: .85rem
    }

    .empty {
      text-align: center;
      color: var(--mut);
      padding: 40px 16px
    }

    dialog {
      border: 1px solid var(--br);
      border-radius: 16px;
      background: var(--card);
      color: var(--tx);
      padding: 22px;
      width: min(560px, 94vw);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .3)
    }

    dialog::backdrop {
      background: rgba(8, 15, 26, .55)
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .full {
      grid-column: 1/-1
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--navy);
      color: #fff;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: .9rem;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 9
    }

    #toast.on {
      opacity: 1
    }

    @media(max-width:560px) {
      .dash {
        grid-template-columns: 1fr;
        justify-items: center
      }

      .chips {
        grid-template-columns: repeat(2, 1fr)
      }

      form {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="in">
      <div class="top">
        <div class="brand"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="#04241a" stroke-width="2.5" stroke-linecap="round">
              <path d="M3 17l6-6 4 4 8-8M15 7h6v6" />
            </svg></span>Metas Possíveis</div>
        <div class="acts">
          <button class="g" id="bExp">⬇ Exportar backup</button>
          <button class="g" id="bImp">⬆ Importar backup</button>
          <button class="g" id="bDir">📁 Pasta de backup</button>
          <input type="file" id="file" accept=".json,application/json" hidden>
        </div>
      </div>
      <h1>Grande no total, pequeno no dia a dia.</h1>
      <p>Divida qualquer objetivo em valores diários, semanais e mensais e acompanhe cada passo até a conquista.</p>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>Visão geral</h2>
      <div class="dash" id="dash"></div>
      <div class="bk" style="margin-top:18px;padding-top:14px;border-top:1px solid var(--br)">
        <span class="pill"><i class="dot" id="dot"></i><span id="bkTxt">Backup: não configurado</span></span>
        <label style="min-width:230px">WhatsApp do cliente (DDD + número)<input id="phone" inputmode="tel"
            placeholder="11999999999"></label>
      </div>
      <div id="banner"><span id="bnTxt"></span><button class="p" id="bnBtn">Restaurar</button></div>
    </div>

    <div class="top2">
      <h3>Suas metas</h3><button id="bNew">＋ Nova meta</button>
    </div>
    <div class="goals" id="goals"></div>
  </main>

  <dialog id="dlg">
    <form id="f" method="dialog">
      <h2 class="full">Nova meta</h2>
      <label>Ícone<select id="emoji">
          <option>🏠</option>
          <option>🚗</option>
          <option>✈️</option>
          <option>💻</option>
          <option>📱</option>
          <option>🎓</option>
          <option>💍</option>
          <option>🏍️</option>
          <option>🛡️</option>
          <option>🎯</option>
        </select></label>
      <label>Nome<input id="name" required placeholder="Ex.: Notebook novo"></label>
      <label>Preço total (R$)<input id="total" type="number" min="1" step="0.01" required></label>
      <label>Já tenho (R$)<input id="initial" type="number" min="0" step="0.01" value="0"></label>
      <label>Conquistar até<input id="deadline" type="date" required></label>
      <label>Guardar<select id="freq">
          <option value="d">Todo dia</option>
          <option value="w">Toda semana</option>
          <option value="m" selected>Todo mês</option>
        </select></label>
      <div class="full row" style="justify-content:flex-end"><button type="button" class="s"
          id="bCancel">Cancelar</button><button type="submit">Criar meta</button></div>
    </form>
  </dialog>
  <div id="toast"></div>

  <script>
    const $ = s => document.querySelector(s);
    const brl = n => (+n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const FN = { d: 'dia', w: 'semana', m: 'mês' }, FV = { d: 'diário', w: 'semanal', m: 'mensal' };
    const p2 = n => String(n).padStart(2, '0');
    let goals = [], savedAt = 0, dir = null, sessionFile = null, timer = null, pending = null;
    try { goals = JSON.parse(localStorage.getItem('metas') || '[]'); savedAt = +localStorage.getItem('savedAt') || 0; $('#phone').value = localStorage.getItem('phone') || '' } catch (e) { }
    function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2800) }
    function persist() { try { localStorage.setItem('metas', JSON.stringify(goals)); localStorage.setItem('savedAt', savedAt); localStorage.setItem('phone', $('#phone').value) } catch (e) { } }
    function save() { savedAt = Date.now(); persist(); clearTimeout(timer); if (dir) timer = setTimeout(() => writeBackup().catch(() => { }), 1200) }
    const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d };
    const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) };
    const fmtD = d => d.toLocaleDateString('pt-BR');
    const fmtDT = t => new Date(t).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    const stamp = d => d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds());
    (() => { const d = new Date(); d.setFullYear(d.getFullYear() + 1); $('#deadline').value = d.toISOString().slice(0, 10) })();

    function calc(g) {
      const t = today(), end = parseD(g.deadline), days = Math.max(1, Math.ceil((end - t) / 864e5));
      const saved = Math.min(g.total, g.initial + g.deposits.reduce((a, b) => a + b, 0)), rem = Math.max(0, g.total - saved);
      let n = g.freq === 'd' ? days : g.freq === 'w' ? Math.ceil(days / 7) : (end.getFullYear() - t.getFullYear()) * 12 + end.getMonth() - t.getMonth();
      n = Math.max(1, n);
      return { days, saved, rem, n, per: rem / n, perDay: rem / days, pct: g.total ? saved / g.total * 100 : 0, done: rem <= 0 };
    }
    function phrase(d, done) {
      if (done) return '🎉 Meta conquistada! Parabéns pela disciplina.';
      if (d <= 5) return '☕ Menos que um cafezinho por dia.';
      if (d <= 15) return '🥪 Menos que um lanche por dia.';
      if (d <= 35) return '🍕 Menos que uma pizza por dia — pequenos ajustes já resolvem.';
      return '💪 Exige foco: ampliar o prazo alivia o valor de cada depósito.';
    }
    const nextDate = () => { const d = today(); d.setHours(9); d.setDate(d.getDate() + 1); return d };
    const iso = d => d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + 'T' + p2(d.getHours()) + p2(d.getMinutes()) + '00';
    const isoD = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':00';
    function gcal(g, c) {
      const s = nextDate(), e = new Date(s.getTime() + 18e5);
      return 'https://calendar.google.com/calendar/render?' + new URLSearchParams({
        action: 'TEMPLATE', text: `💰 Guardar ${brl(c.per)} – ${g.name}`,
        details: `Meta: ${g.name}\nTotal: ${brl(g.total)}\nGuardado: ${brl(c.saved)}\nFalta: ${brl(c.rem)}\nGuardar ${brl(c.per)} por ${FN[g.freq]} até ${fmtD(parseD(g.deadline))}.`,
        dates: iso(s) + '/' + iso(e), recur: `RRULE:FREQ=${{ d: 'DAILY', w: 'WEEKLY', m: 'MONTHLY' }[g.freq]};COUNT=${c.n}`
      })
    }
    function outl(g, c) {
      const s = nextDate(), e = new Date(s.getTime() + 18e5);
      return 'https://outlook.live.com/calendar/0/deeplink/compose?' + new URLSearchParams({
        path: '/calendar/action/compose', rru: 'addevent', subject: `💰 Guardar ${brl(c.per)} – ${g.name}`, startdt: isoD(s), enddt: isoD(e),
        body: `Meta: ${g.name}. Guardar ${brl(c.per)} por ${FN[g.freq]} até ${fmtD(parseD(g.deadline))}. Falta ${brl(c.rem)}. (Defina "repetir" no Outlook.)`
      })
    }
    function wa(g, c) {
      const msg = `🎯 *Meta: ${g.emoji} ${g.name}*\n💰 Total: ${brl(g.total)}\n✅ Guardado: ${brl(c.saved)} (${c.pct.toFixed(0)}%)\n⏳ Falta: ${brl(c.rem)}\n📅 Prazo: ${fmtD(parseD(g.deadline))} (${c.days} dias)\n\n👉 Guarde *${brl(c.per)} por ${FN[g.freq]}* (${c.n} depósitos)\n• ${brl(c.perDay)} por dia\n• ${brl(c.perDay * 7)} por semana\n• ${brl(c.perDay * 30.44)} por mês\n\nVocê consegue! 💪`;
      let ph = $('#phone').value.replace(/\D/g, ''); if (ph && ph.length <= 11) ph = '55' + ph;
      return 'https://wa.me/' + ph + '?text=' + encodeURIComponent(msg)
    }

    function render() {
      const cs = goals.map(calc), T = goals.reduce((a, g) => a + g.total, 0), S = cs.reduce((a, c) => a + c.saved, 0), P = T ? S / T * 100 : 0;
      $('#dash').innerHTML = `<div class="ring" style="--p:${P}"><span>${P.toFixed(0)}%</span></div><div class="kpis">
  <div class="k"><small>Soma dos objetivos</small><b>${brl(T)}</b></div><div class="k"><small>Já conquistado</small><b>${brl(S)}</b></div>
  <div class="k"><small>Ainda falta</small><b>${brl(T - S)}</b></div><div class="k"><small>Ritmo mensal total</small><b>${brl(cs.reduce((a, c) => a + c.perDay * 30.44, 0))}</b></div>
  <div class="k"><small>Metas concluídas</small><b>${cs.filter(c => c.done).length} de ${goals.length}</b></div></div>`;
      $('#goals').innerHTML = goals.length ? goals.map((g, i) => {
        const c = cs[i], on = Math.min(g.deposits.length, 40), off = c.done ? 0 : Math.min(c.n, 60 - on);
        return `<div class="card"><div class="gh"><span class="emo">${g.emoji}</span><div style="flex:1"><h3>${esc(g.name)}</h3>
      <div class="m">${brl(g.total)} · até ${fmtD(parseD(g.deadline))} · ${c.days} dias</div></div>
      <div class="ring sm" style="--p:${c.pct}"><span>${c.pct.toFixed(0)}%</span></div></div>
      <div class="mut" style="margin-top:12px">Guardado <b>${brl(c.saved)}</b> · falta <b>${brl(c.rem)}</b></div>
      <div class="tag">${phrase(c.perDay, c.done)}</div>
      <div class="chips"><div class="chip ${g.freq === 'd' ? 'hl' : ''}"><small>dia</small><b>${brl(c.perDay)}</b></div>
      <div class="chip ${g.freq === 'w' ? 'hl' : ''}"><small>semana</small><b>${brl(c.perDay * 7)}</b></div>
      <div class="chip ${g.freq === 'm' ? 'hl' : ''}"><small>mês</small><b>${brl(c.perDay * 30.44)}</b></div>
      <div class="chip"><small>ano</small><b>${brl(c.perDay * 365)}</b></div></div>
      ${c.done ? '' : `<div class="mut" style="margin-top:14px">Plano ${FV[g.freq]}: <b>${c.n}</b> depósitos de <b>${brl(c.per)}</b> — cada quadrado é um depósito.</div>
      <div class="cells">${'<i class="cell on"></i>'.repeat(on) + '<i class="cell"></i>'.repeat(Math.max(0, off))}</div>
      <div class="row"><button class="p" data-a="dep" data-i="${i}" data-v="${c.per.toFixed(2)}">✓ Guardei ${brl(c.per)}</button>
      <input type="number" min="0.01" step="0.01" placeholder="Outro valor" id="v${i}"><button class="s" data-a="cus" data-i="${i}">Registrar</button>
      <button class="s" data-a="undo" data-i="${i}">↩</button></div>`}
      <div class="row" style="padding-top:12px;border-top:1px solid var(--br)"><button class="s" data-a="wa" data-i="${i}">📲 WhatsApp</button>
      <button class="s" data-a="g" data-i="${i}">📅 Google</button><button class="s" data-a="o" data-i="${i}">📅 Outlook</button>
      <button class="s" data-a="del" data-i="${i}" style="margin-left:auto">Excluir</button></div></div>`
      }).join('')
        : '<div class="card empty" style="grid-column:1/-1">Nenhuma meta ainda. Clique em “Nova meta” e veja quanto ela cabe no seu dia. ✨</div>';
    }

    /* ---------- Backup ---------- */
    const valid = d => d && d.app === 'metas-possiveis' && Array.isArray(d.goals);
    const payload = () => ({ app: 'metas-possiveis', version: 1, exportedAt: savedAt || Date.now(), phone: $('#phone').value, goals });
    function apply(d) { goals = d.goals; $('#phone').value = d.phone || ''; savedAt = d.exportedAt || Date.now(); persist(); render() }
    function status(t, ok) { $('#bkTxt').textContent = t; $('#dot').className = 'dot' + (ok ? ' ok' : '') }
    const idb = () => new Promise((res, rej) => { const r = indexedDB.open('metas', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error) });
    const kv = async (m, k, v) => { const d = await idb(); return new Promise((res, rej) => { const s = d.transaction('kv', m === 'get' ? 'readonly' : 'readwrite').objectStore('kv'); const q = m === 'get' ? s.get(k) : s.put(v, k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error) }) };
    async function writeBackup() {
      if (!dir) return;
      sessionFile = sessionFile || `metas-backup_${stamp(new Date())}.json`;
      const w = await (await dir.getFileHandle(sessionFile, { create: true })).createWritable();
      await w.write(JSON.stringify(payload(), null, 2)); await w.close();
      status('Backup salvo na pasta · ' + fmtDT(Date.now()), true);
    }
    async function checkLatest() {
      let best = null;
      for await (const [n, h] of dir.entries()) if (/^metas-backup_\d{8}-\d{6}\.json$/.test(n) && (!best || n > best.n)) best = { n, h };
      if (!best) { status('Pasta conectada · nenhum backup ainda', true); if (goals.length) writeBackup().catch(() => { }); return }
      let d; try { d = JSON.parse(await (await best.h.getFile()).text()) } catch (e) { status('Backup ilegível: ' + best.n); return }
      if (!valid(d)) { status('Arquivo de backup inválido'); return }
      if (!goals.length) { apply(d); toast('Backup mais recente carregado automaticamente'); status('Restaurado de ' + fmtDT(d.exportedAt), true); return }
      if (d.exportedAt > savedAt + 1000) { pending = d; $('#bnTxt').textContent = 'Backup mais recente encontrado (' + fmtDT(d.exportedAt) + '), mais novo que os dados deste navegador.'; $('#banner').style.display = 'flex'; status('Backup mais novo disponível') }
      else { status('Dados atualizados · último backup ' + fmtDT(d.exportedAt), true) }
    }
    async function initDir() {
      if (!('showDirectoryPicker' in window)) { status('Backup automático indisponível neste navegador. Use exportar/importar.'); $('#bDir').style.display = 'none'; return }
      try { dir = await kv('get', 'dir') } catch (e) { }
      if (!dir) { status('Backup: escolha uma pasta para salvar automaticamente'); return }
      if (await dir.queryPermission({ mode: 'readwrite' }) === 'granted') return checkLatest();
      status('Pasta salva — clique em “Pasta de backup” para reconectar');
    }
    $('#bDir').onclick = async () => {
      try {
        if (dir && await dir.queryPermission({ mode: 'readwrite' }) !== 'granted') { if (await dir.requestPermission({ mode: 'readwrite' }) !== 'granted') return }
        else if (!dir || confirm('Trocar a pasta de backup?')) { dir = await showDirectoryPicker({ mode: 'readwrite', id: 'metas' }); await kv('put', 'dir', dir) }
        await checkLatest();
      } catch (e) { }
    };
    $('#bnBtn').onclick = () => { if (pending) { apply(pending); pending = null; $('#banner').style.display = 'none'; status('Backup restaurado', true); toast('Backup restaurado') } };
    $('#bExp').onclick = async () => {
      if (!goals.length && !confirm('Não há metas. Exportar mesmo assim?')) return;
      if (dir) { try { await writeBackup(); toast('Backup salvo na pasta'); return } catch (e) { } }
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(payload(), null, 2)], { type: 'application/json' }));
      a.download = `metas-backup_${stamp(new Date())}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('Arquivo exportado');
    };
    $('#bImp').onclick = () => $('#file').click();
    $('#file').onchange = async e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      try {
        const d = JSON.parse(await f.text()); if (!valid(d)) throw 0;
        if (confirm(`Importar ${d.goals.length} meta(s) e substituir os dados atuais?`)) { apply(d); toast('Backup importado com sucesso') }
      } catch (x) { toast('Arquivo inválido: use um backup exportado por este sistema') }
    };

    /* ---------- Eventos ---------- */
    $('#bNew').onclick = () => $('#dlg').showModal();
    $('#bCancel').onclick = () => $('#dlg').close();
    $('#f').addEventListener('submit', e => {
      goals.push({ id: Date.now(), emoji: $('#emoji').value, name: $('#name').value.trim(), total: +$('#total').value, initial: +$('#initial').value || 0, deadline: $('#deadline').value, freq: $('#freq').value, deposits: [] });
      e.target.reset(); $('#initial').value = 0; const d = new Date(); d.setFullYear(d.getFullYear() + 1); $('#deadline').value = d.toISOString().slice(0, 10);
      save(); render();
    });
    $('#phone').addEventListener('input', () => { persist() });
    $('#goals').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const i = +b.dataset.i, g = goals[i], a = b.dataset.a;
      if (a === 'del') { if (confirm('Excluir esta meta?')) { goals.splice(i, 1); save(); render() } return }
      if (a === 'dep') g.deposits.push(+b.dataset.v);
      else if (a === 'cus') { const v = +$('#v' + i).value; if (!(v > 0)) return; g.deposits.push(v) }
      else if (a === 'undo') g.deposits.pop();
      else { const c = calc(g); window.open(a === 'wa' ? wa(g, c) : a === 'g' ? gcal(g, c) : outl(g, c), '_blank', 'noopener'); return }
      save(); render();
    });
    render(); initDir();
  </script>
</body>

</html>
