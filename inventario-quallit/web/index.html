<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- segurança: só carrega código daqui, do jsDelivr (bibliotecas com versão fixa) e conversa só com o Supabase do inventário -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://wrmlmtxkukjxkivtsuex.supabase.co wss://wrmlmtxkukjxkivtsuex.supabase.co https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventário Quallit</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/prazo.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0c2226">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js" integrity="sha384-Kk5SjBOKprEnGfyBWfD2zROFd1Cu8kwOXxG2GIhYPcoDL2rBJS9P8Ud1ZMy4412a" crossorigin="anonymous" defer></script>
</head>
<body>

  <!-- LOGIN -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="brand brand--lg"><span class="brand-mark"></span><div><strong>Inventário</strong><small>Quallit · CD</small></div></div>
      <p class="muted">Controle de computadores e notebooks</p>
      <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
      <label>Senha<input type="password" name="senha" required autocomplete="current-password"></label>
      <button class="btn btn--primary btn--block" type="submit">Entrar</button>
      <p id="login-erro" class="erro" role="alert"></p>
    </form>
  </section>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark"></span><div><strong>Inventário</strong><small>Quallit · CD</small></div></div>
      <div class="cd-box" id="cd-box" hidden></div>
      <nav class="nav">
        <button data-view="painel" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/></svg>Painel</button>
        <button data-view="maquinas" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 5h16v10H4zM2 19h20" fill="none" stroke="currentColor" stroke-width="2"/></svg>Máquinas</button>
        <button data-view="emprestimos" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 6h16v9H4zM2 18h20M9 10h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Empréstimos<span class="nav-badge" id="badge-emp" hidden></span></button>
        <button data-view="conferencia" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 5h2v14H3zm4 0h1v14H7zm3 0h3v14h-3zm5 0h1v14h-1zm3 0h3v14h-3z"/></svg>Inventários</button>
        <button data-view="patrimonio" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4zM9 7V4h6v3M9 12h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Patrimônio<span class="nav-badge" id="badge-pat" hidden></span></button>
        <button data-view="relatorios" class="nav-item"><svg viewBox="0 0 24 24"><path d="M5 20V10m7 10V4m7 16v-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Relatórios</button>
        <button data-view="coleta" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.4 9.3 8 10 4.6-.7 8-5 8-10V6z" fill="none" stroke="currentColor" stroke-width="2"/></svg>Coleta</button>
        <button data-view="usuarios" class="nav-item" data-admin hidden><svg viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 10c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6m2 16c0-3-1-5-3-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Usuários e CDs</button>
      </nav>
      <div class="sidebar-foot">
        <div class="live"><span class="live-dot"></span><span id="live-txt">conectando…</span></div>
        <div class="user" id="user-email"></div>
        <div class="foot-actions">
          <button class="btn btn--ghost btn--sm" id="btn-tema" title="Alternar tema">◐ Tema</button>
          <button class="btn btn--ghost btn--sm" id="btn-sair">Sair</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div id="net-banner" class="net-banner" hidden></div>
      <section id="view-painel" class="view"></section>
      <section id="view-maquinas" class="view" hidden></section>
      <section id="view-emprestimos" class="view" hidden></section>
      <section id="view-etiquetas" class="view" hidden></section>
      <section id="view-conferencia" class="view" hidden></section>
      <section id="view-coleta" class="view" hidden></section>
      <section id="view-relatorios" class="view" hidden></section>
      <section id="view-patrimonio" class="view" hidden></section>
      <section id="view-usuarios" class="view" hidden></section>
    </main>
  </div>

  <!-- DRAWER (detalhe da máquina) -->
  <div id="drawer-bg" class="drawer-bg" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true"></aside>

  <!-- MODAL -->
  <dialog id="modal" class="modal"></dialog>
  <dialog id="modal-cam" class="modal"></dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
