<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventário Quallit</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23d9302c'/><path d='M8 10h16v10H8z M12 23h8' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- LOGIN -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="brand brand--lg"><span class="brand-mark"></span><div><strong>Inventário</strong><small>Quallit · CD</small></div></div>
      <p class="muted">Controle de computadores e notebooks</p>
      <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
      <label>Senha<input type="password" name="senha" required autocomplete="current-password"></label>
      <button class="btn btn--primary btn--block" type="submit">Entrar</button>
      <p id="login-erro" class="erro" role="alert"></p>
    </form>
  </section>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark"></span><div><strong>Inventário</strong><small>Quallit · CD</small></div></div>
      <nav class="nav">
        <button data-view="painel" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/></svg>Painel</button>
        <button data-view="maquinas" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 5h16v10H4zM2 19h20" fill="none" stroke="currentColor" stroke-width="2"/></svg>Máquinas</button>
        <button data-view="conferencia" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 5h2v14H3zm4 0h1v14H7zm3 0h3v14h-3zm5 0h1v14h-1zm3 0h3v14h-3z"/></svg>Conferência</button>
        <button data-view="agente" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.4 9.3 8 10 4.6-.7 8-5 8-10V6z" fill="none" stroke="currentColor" stroke-width="2"/></svg>Agente coletor</button>
      </nav>
      <div class="sidebar-foot">
        <div class="live"><span class="live-dot"></span><span id="live-txt">conectando…</span></div>
        <div class="user" id="user-email"></div>
        <div class="foot-actions">
          <button class="btn btn--ghost btn--sm" id="btn-tema" title="Alternar tema">◐ Tema</button>
          <button class="btn btn--ghost btn--sm" id="btn-sair">Sair</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <section id="view-painel" class="view"></section>
      <section id="view-maquinas" class="view" hidden></section>
      <section id="view-conferencia" class="view" hidden></section>
      <section id="view-agente" class="view" hidden></section>
    </main>
  </div>

  <!-- DRAWER (detalhe da máquina) -->
  <div id="drawer-bg" class="drawer-bg" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true"></aside>

  <!-- MODAL -->
  <dialog id="modal" class="modal"></dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
