<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- segurança: só carrega código daqui, do jsDelivr (bibliotecas com versão fixa) e conversa só com o Supabase do inventário -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://wrmlmtxkukjxkivtsuex.supabase.co wss://wrmlmtxkukjxkivtsuex.supabase.co https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <!-- maximum-scale=1 + campos com 16px: o celular não dá zoom ao tocar nos campos -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2226">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Conferência">
  <meta name="format-detection" content="telephone=no">
  <title>Conferência Quallit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/prazo.css">
  <link rel="stylesheet" href="campo.css">
</head>
<body>
  <!-- abertura -->
  <div id="splash" class="splash"><span class="logo logo--lg"></span></div>

  <!-- LOGIN -->
  <section id="t-login" class="tela tela--login" hidden>
    <div class="login-topo">
      <span class="logo logo--lg"></span>
      <h1>Conferência</h1>
      <p>Inventário Quallit · uso em campo</p>
    </div>
    <form id="login-form" class="login-form" autocomplete="on">
      <label class="campo">
        <span>E-mail</span>
        <input type="email" name="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </label>
      <label class="campo">
        <span>Senha</span>
        <span class="campo-senha">
          <input type="password" name="senha" autocomplete="current-password" required>
          <button type="button" class="olho" id="ver-senha" aria-label="Mostrar senha">👁</button>
        </span>
      </label>
      <button class="btn btn--pri btn--bloco" type="submit" id="btn-entrar">Entrar</button>
      <p class="erro" id="login-erro" role="alert"></p>
    </form>
    <button class="link-instalar" id="instalar-login" hidden>⬇ Instalar o app neste celular</button>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <header class="barra" id="barra">
      <button class="barra-voltar" id="btn-voltar" aria-label="Voltar" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="logo" id="barra-logo"></span>
      <div class="barra-titulo"><strong id="barra-titulo">Conferência</strong><small id="barra-sub"></small></div>
      <span class="sync" id="sync" title="Sincronização"></span>
      <button class="barra-menu" id="btn-menu" aria-label="Menu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </header>

    <main class="conteudo">
      <!-- INÍCIO: lista de inventários -->
      <section id="t-inicio" class="tela" hidden></section>
      <!-- CONFERÊNCIA -->
      <section id="t-conf" class="tela tela--conf" hidden></section>
      <!-- RESUMO / FINALIZAR -->
      <section id="t-final" class="tela" hidden></section>
    </main>
  </div>

  <!-- folha inferior (detalhes, menus, formulários) -->
  <div id="folha-fundo" class="folha-fundo" hidden></div>
  <div id="folha" class="folha" role="dialog" aria-modal="true" hidden></div>

  <!-- câmera -->
  <div id="camera" class="camera" hidden>
    <video id="cam-video" playsinline muted></video>
    <div class="cam-mira"><span></span></div>
    <p class="cam-dica" id="cam-dica">Aponte para o QR code ou o código de barras da etiqueta</p>
    <div class="cam-acoes">
      <button class="btn btn--claro" id="cam-lanterna" hidden>🔦 Lanterna</button>
      <button class="btn btn--claro" id="cam-fechar">Fechar</button>
    </div>
    <div class="cam-ultimo" id="cam-ultimo" hidden></div>
  </div>

  <div id="avisos" class="avisos" aria-live="polite"></div>

  <script type="module" src="campo.js"></script>
</body>
</html>
