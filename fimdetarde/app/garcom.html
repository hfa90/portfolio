<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fim de Tarde — Painel do Garçom</title>
<link rel="stylesheet" href="./shared/styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ width:100%; max-width:380px; text-align:center; }
  .login-card .brand-mark{ margin:0 auto 14px; width:52px; height:52px; font-size:1.2rem; }

  .grid-sessions{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:14px; margin-top:16px; }
  .session-card{ cursor:pointer; }
  .session-card:hover{ border-color:var(--accent); }
  .session-card .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .session-card .num{ font-family:var(--font-display); font-size:1.6rem; }
  .pending-pill{ background: rgba(255,107,53,.18); color:var(--accent); font-family:var(--font-mono); font-size:.75rem; padding:4px 10px; border-radius:999px; }

  .back-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .comanda-block{ margin-bottom:18px; }
  .comanda-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .item-line{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .item-line .meta{ font-size:.78rem; color:var(--cream-dim); }
  .item-actions{ display:flex; gap:6px; }

  #qr-reader{ width:100%; border-radius:14px; overflow:hidden; }
  .scan-fallback{ margin-top:14px; }

  .menu-picker .cat-title{ margin:18px 0 8px; }
</style>
</head>
<body>
<div id="app" class="loading-screen"><div class="spinner"></div><p class="eyebrow">carregando…</p></div>
<script type="module" src="./garcom.js"></script>
</body>
</html>
