<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fim de Tarde — Admin</title>
<link rel="stylesheet" href="./shared/styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ width:100%; max-width:380px; text-align:center; }
  .login-card .brand-mark{ margin:0 auto 14px; width:52px; height:52px; font-size:1.2rem; }

  .admin-tabs{ padding: 16px 20px 0; }
  .grid-tables{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:14px; margin-top:16px; }
  .table-card{ text-align:center; }
  .table-card .qr-box{ background:#fff; padding:10px; border-radius:12px; display:inline-block; margin:10px 0; }
  .table-card .num{ font-family:var(--font-display); font-size:1.6rem; }

  .menu-item-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }
  .staff-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }

  .add-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:16px; }
  .add-form .field{ margin-bottom:0; flex:1; min-width:140px; }
</style>
</head>
<body>
<div id="app" class="loading-screen"><div class="spinner"></div><p class="eyebrow">carregando…</p></div>
<script type="module" src="./admin.js"></script>
</body>
</html>
