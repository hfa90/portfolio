<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fim de Tarde — Peça pelo QR</title>
<link rel="stylesheet" href="./shared/styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  .hero{ padding: 46px 6px 20px; text-align:center; }
  .hero h1{ font-size: 2.1rem; line-height:1.05; }
  .hero .table-chip{
    display:inline-flex; align-items:center; gap:8px; margin-bottom:16px;
    background: var(--surface); border:1px solid var(--line); padding:6px 14px 6px 6px; border-radius:999px;
  }
  .hero .table-chip .num{
    width:26px; height:26px; border-radius:50%; background: var(--accent); color:#2A0E00;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:.8rem;
  }
  .onboard-choices{ display:flex; flex-direction:column; gap:12px; margin-top: 26px; }
  .choice-card{
    text-align:left; padding:18px; border-radius: var(--radius); border:1px solid var(--line);
    background: var(--surface); cursor:pointer; display:flex; gap:14px; align-items:center;
  }
  .choice-card:hover{ border-color: var(--accent); }
  .choice-card .glyph{ font-size:1.7rem; }
  .choice-card h3{ font-size:1rem; margin-bottom:2px; }
  .choice-card p{ margin:0; font-size:.85rem; }

  .cat-title{ margin: 26px 0 12px; display:flex; align-items:baseline; gap:10px; }
  .cat-title .count{ font-family:var(--font-mono); font-size:.75rem; color:var(--cream-dim); }
  .item-row{
    display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .item-row .info{ flex:1; min-width:0; }
  .item-row h4{ font-size:.95rem; margin:0 0 3px; }
  .item-row p{ font-size:.8rem; margin:0; }
  .item-row .price{ font-family:var(--font-mono); color: var(--accent-2); font-size:.85rem; margin-top:4px; }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--bg-2); color:var(--cream);
    font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .stepper .n{ min-width:16px; text-align:center; font-family:var(--font-mono); }
  .add-btn{ background: var(--accent); color:#2A0E00; border:none; border-radius:999px; padding:8px 16px; font-weight:700; font-size:.82rem; cursor:pointer; }

  .cart-bar{
    position: fixed; left:0; right:0; bottom:0; z-index:70;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
  }
  .cart-bar .inner{
    max-width: 620px; margin: 0 auto; display:flex; align-items:center; justify-content:space-between;
    background: linear-gradient(135deg, var(--accent), #ff8a5c); color:#2A0E00; border-radius:999px;
    padding: 13px 10px 13px 20px; box-shadow: 0 12px 26px rgba(255,107,53,.35); cursor:pointer; font-weight:700;
  }

  .qr-box{ background:#fff; padding:14px; border-radius:14px; display:inline-block; }
  .split-input{ display:flex; align-items:center; gap:10px; }
  .split-input input{ width:70px; text-align:center; }
</style>
</head>
<body>

<div id="app" class="loading-screen">
  <div class="spinner"></div>
  <p class="eyebrow">carregando cardápio…</p>
</div>

<script type="module" src="./cliente.js"></script>
</body>
</html>
