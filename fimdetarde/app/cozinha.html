<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fim de Tarde — Painel da Cozinha/Bar</title>
<link rel="stylesheet" href="./shared/styles.css" />
<style>
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ width:100%; max-width:380px; text-align:center; }
  .login-card .brand-mark{ margin:0 auto 14px; width:52px; height:52px; font-size:1.2rem; }

  .board{ display:grid; grid-template-columns: repeat(3, minmax(260px,1fr)); gap:16px; padding: 18px 20px 40px; overflow-x:auto; }
  @media (max-width: 900px){ .board{ grid-template-columns: 1fr; } }
  .column{ background: var(--bg-2); border:1px solid var(--line); border-radius: var(--radius); padding:14px; min-height: 160px; }
  .column h3{ display:flex; align-items:center; gap:8px; font-size:.95rem; margin-bottom:12px; }
  .column .count{ font-family:var(--font-mono); font-size:.72rem; color:var(--cream-dim); background:var(--surface); padding:2px 8px; border-radius:999px; }
  .order-card{ margin-bottom:12px; }
  .order-card .top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .order-card .table-tag{ font-family:var(--font-mono); font-weight:700; color:var(--accent-2); }
  .order-card .who{ font-size:.76rem; color:var(--cream-dim); }
  .order-card .qty{ font-family:var(--font-mono); color:var(--accent); }
  .order-card .actions{ display:flex; gap:6px; margin-top:10px; }

  .station-tabs{ padding: 16px 20px 0; }
</style>
</head>
<body>
<div id="app" class="loading-screen"><div class="spinner"></div><p class="eyebrow">carregando…</p></div>
<script type="module" src="./cozinha.js"></script>
</body>
</html>
